name: Build APK

# Every push to main: analyze, test, build the Android APKs and publish ONE
# release (v0.2.<run>) with all files. Old releases are never deleted.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so builds are repeatable. Change on purpose, not by accident.
  FLUTTER_VERSION: '3.27.4'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare Android project
        run: |
          flutter --version
          flutter create --project-name chashibondhu --org com.chashibondhu --platforms android .
          dart run tool/patch_android.dart
          flutter pub get

      - name: Analyze (errors only fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: chashibondhu
        run: >
          flutter build apk --release --split-per-abi
          --build-name=0.2.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Collect APKs and check size (< 40 MB)
        run: |
          mkdir out
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            n=$(basename "$f"); abi=${n#app-}; abi=${abi%-release.apk}
            cp "$f" "out/Chashibondhu-${abi}.apk"
          done
          ls -lh out
          for f in out/*.apk; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt 41943040 ]; then echo "::error::$f is larger than 40 MB"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: চাষিবন্ধু v0.2.${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            ### 📱 কোন ফাইলটা নামাবেন?
            - `Chashibondhu-armeabi-v7a.apk` — কম দামি বা পুরনো ফোন (Android ৮+) ✅
            - `Chashibondhu-arm64-v8a.apk` — ২০১৮ সালের পরের বেশিরভাগ ফোন ✅
            - `Chashibondhu-x86_64.apk` — ইমুলেটর / কম্পিউটার

            কোনটা লাগবে না জানলে প্রথমে arm64 দিন; ইনস্টল না হলে armeabi-v7a দিন।
            নতুন সংস্করণ পুরনোটার উপরেই ইনস্টল হয়, তথ্য মুছে যায় না।
            পরীক্ষার চেকলিস্ট: TESTING_BN.md
