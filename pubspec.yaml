name: chashibondhu
description: "চাষিবন্ধু — চাষির পাশে, সব সময়"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Offline-first local storage (plain maps, no code generation).
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Photo of fish / leaf (camera or gallery).
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  # Weather (Open-Meteo, no key).
  http: ^1.2.2
  # Local reminders. Kept on 17.x on purpose: its API is what the code uses.
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  # Optional cloud sync. App works fully without it.
  supabase_flutter: ^2.8.0
  # Phone call to officer / helpline.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    # Bundled so Bangla joined letters show correctly on every phone.
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
